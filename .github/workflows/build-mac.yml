name: macOS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Wails 目标平台"
        type: choice
        options:
          - darwin/universal
          - darwin/arm64
          - darwin/amd64
        default: darwin/universal
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      WAILS_PLATFORM: ${{ github.event.inputs.platform || 'darwin/universal' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go 编译与测试
        run: |
          go build ./...
          go test ./...

      - name: 前端构建与测试
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend test

      - name: 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Wails 环境检查
        run: wails doctor || true

      - name: 构建 Core、App 与 DMG
        run: bash scripts/build-mac.sh

      - name: 校验并整理产物
        run: |
          set -euo pipefail

          APP_PATH="build/bin/easyshare.app"
          APP_EXEC="$APP_PATH/Contents/MacOS/easyshare"
          CORE_EXEC="$APP_PATH/Contents/MacOS/easyshare-core"
          DMG_PATH="build/bin/EasyShare.dmg"
          APP_ZIP="build/bin/EasyShare.app.zip"

          test -d "$APP_PATH"
          test -x "$APP_EXEC"
          test -x "$CORE_EXEC"
          test -s "$DMG_PATH"

          case "$WAILS_PLATFORM" in
            darwin/universal)
              lipo -verify_arch arm64 x86_64 "$APP_EXEC"
              lipo -verify_arch arm64 x86_64 "$CORE_EXEC"
              ;;
            darwin/arm64)
              lipo -verify_arch arm64 "$APP_EXEC"
              lipo -verify_arch arm64 "$CORE_EXEC"
              ;;
            darwin/amd64)
              lipo -verify_arch x86_64 "$APP_EXEC"
              lipo -verify_arch x86_64 "$CORE_EXEC"
              ;;
          esac

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$APP_ZIP"
          cd build/bin
          shasum -a 256 EasyShare.dmg EasyShare.app.zip > SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: EasyShare-macOS-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/bin/EasyShare.dmg
            build/bin/EasyShare.app.zip
            build/bin/SHA256SUMS.txt

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/EasyShare.dmg
            build/bin/EasyShare.app.zip
            build/bin/SHA256SUMS.txt
