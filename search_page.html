<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全局搜索</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --text: #1d1d1f; --muted: #86868b; --line: rgba(60,60,67,.1); --blue: #0071e3; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f5f5f7; --muted: #86868b; --line: rgba(255,255,255,.12); --blue: #2997ff; }
    body { background: #1e1e20; }
  }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "Microsoft YaHei UI", sans-serif; color: var(--text); background: #f5f5f7; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e20; } }
  .wrap { display: flex; flex-direction: column; height: 100vh; }
  .search-box { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .search-box svg { width: 15px; height: 15px; stroke: var(--muted); stroke-width: 2; fill: none; flex: none; }
  .search-box input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; color: var(--text); }
  .results { flex: 1; overflow-y: auto; padding: 6px 0; }
  .group { padding: 6px 14px 2px; font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: .05em; }
  .row { display: flex; flex-direction: column; gap: 2px; padding: 7px 14px; cursor: pointer; }
  .row.sel { background: var(--blue); color: #fff; }
  .row.sel .sub { color: rgba(255,255,255,.75); }
  .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 40px 14px; text-align: center; color: var(--muted); font-size: 12px; }
  .foot { display: flex; gap: 12px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 10px; color: var(--muted); }
  kbd { display: inline-block; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; font-size: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="搜索知识与文件…" autocomplete="off" spellcheck="false">
  </div>
  <div class="results" id="results"><div class="empty">输入关键词：知识片段与网盘文件一起搜</div></div>
  <div class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span><kbd>Enter</kbd> 打开 / 复制</span>
    <span><kbd>Esc</kbd> 关闭</span>
    <span id="hk" style="margin-left:auto"></span>
  </div>
</div>
<script>
// 面板宿主桥（与 SDK 同协议的裸实现：本页是宿主表面，不走插件身份）。
var seq = 0, pending = new Map();
window.__eshareNative = {
  deliver: function (msg) {
    var resolve = pending.get(msg.id);
    if (resolve) { pending.delete(msg.id); resolve(msg); }
  }
};
function call(api, args) {
  return new Promise(function (resolve) {
    var id = ++seq;
    pending.set(id, resolve);
    window.chrome.webview.postMessage(JSON.stringify({ __eshare: 1, id: id, api: api, args: args }));
  });
}
function dismiss() { window.chrome.webview.postMessage(JSON.stringify({ __esharePanel: 1, cmd: 'dismiss' })); }

var input = document.getElementById('q');
var resultsEl = document.getElementById('results');
var flat = [];          // 扁平化结果行（跨分组连续选择）
var selected = -1;
var timer = null;

function params() { return new URLSearchParams(location.search); }
var hk = params().get('hk');
if (hk) document.getElementById('hk').textContent = hk + ' 呼出';

function render(hits, query) {
  flat = [];
  var html = '';
  if (!hits.length) {
    resultsEl.innerHTML = '<div class="empty">' + (query ? '没有匹配结果' : '') + '</div>';
    return;
  }
  var kinds = [['knowledge', '知识'], ['file', '文件']];
  kinds.forEach(function (pair) {
    var kind = pair[0], label = pair[1];
    var rows = hits.filter(function (h) { return h.kind === kind; });
    if (!rows.length) return;
    html += '<div class="group">' + label + '</div>';
    rows.forEach(function (hit) {
      flat.push(hit);
      var index = flat.length - 1;
      html += '<div class="row" data-i="' + index + '">'
        + '<div class="title">' + escapeHtml(hit.title) + '</div>'
        + '<div class="sub">' + escapeHtml(hit.sub || '') + '</div></div>';
    });
  });
  resultsEl.innerHTML = html;
  Array.prototype.forEach.call(resultsEl.querySelectorAll('.row'), function (el) {
    el.addEventListener('click', function () { choose(Number(el.dataset.i)); });
    el.addEventListener('mousemove', function () { select(Number(el.dataset.i)); });
  });
  select(0);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function select(index) {
  selected = index;
  Array.prototype.forEach.call(resultsEl.querySelectorAll('.row'), function (el) {
    el.classList.toggle('sel', Number(el.dataset.i) === selected);
  });
  var el = resultsEl.querySelector('.row[data-i="' + selected + '"]');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function choose(index) {
  var hit = flat[index];
  if (!hit) return;
  if (hit.kind === 'file') {
    call('host.open', { key: hit.key, space: hit.space });
    dismiss();
  } else {
    // 知识片段：复制片段正文，粘贴即用（面板收起回到原窗口）
    call('host.copy', { text: hit.title + '\n' + hit.sub });
    dismiss();
  }
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(function () {
    var q = input.value.trim();
    if (!q) { render([], ''); return; }
    call('host.search', { q: q }).then(function (reply) {
      if (reply.ok) render(reply.data || [], q);
    });
  }, 220);
}

input.addEventListener('input', schedule);
input.addEventListener('keydown', function (event) {
  if (event.key === 'ArrowDown') { event.preventDefault(); select(Math.min(selected + 1, flat.length - 1)); }
  else if (event.key === 'ArrowUp') { event.preventDefault(); select(Math.max(selected - 1, 0)); }
  else if (event.key === 'Enter') { event.preventDefault(); choose(selected); }
  else if (event.key === 'Escape') { dismiss(); }
});
input.focus();
</script>
</body>
</html>
