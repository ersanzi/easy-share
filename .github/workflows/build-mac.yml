name: macOS Build

# 只在推送 v* tag 时自动打包；日常验证走本地 build-mac.sh，
# workflow_dispatch 保留为 Actions 页面的手动逃生通道（可选目标平台）。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Wails 目标平台"
        type: choice
        options:
          - darwin/universal
          - darwin/arm64
          - darwin/amd64
        default: darwin/universal
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      WAILS_PLATFORM: ${{ github.event.inputs.platform || 'darwin/universal' }}
      # 与 Windows 工作流同源：客户端烘焙的控制面地址，漏传则退回 localhost:8090。
      # 说明见 build-windows.yml 中同名变量的注释。
      PLATFORM_URL: ${{ vars.PLATFORM_URL || 'http://47.96.128.231:11054' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端构建与测试
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend test

      - name: Go 编译与测试
        run: |
          go build ./...
          go test ./...

      - name: 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Wails 环境检查
        run: wails doctor || true

      - name: 校验平台地址并生成 ldflags
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_URL:-}" ]; then
            echo "::error::PLATFORM_URL 为空：客户端会退回 http://localhost:8090，连不上服务器"
            exit 1
          fi
          # build-mac.sh 读的是 EASYSHARE_PLATFORM_URL（它自己拼 ldflags）。
          # 之前这里导出的是 EASYSHARE_LDFLAGS，与脚本读的变量名不一致 →
          # 脚本拿到空值、LDFLAGS 为空、地址压根没注入，而构建全程无异常，
          # 直到产物断言才报「未找到地址」。变量名必须与脚本保持一致。
          echo "EASYSHARE_PLATFORM_URL=${PLATFORM_URL}" >> "$GITHUB_ENV"
          echo "烘焙控制面地址：${PLATFORM_URL}"

      - name: 构建 Core、App 与 DMG
        run: |
          mkdir -p build/logs
          set -o pipefail
          bash scripts/build-mac.sh 2>&1 | tee build/logs/macos-build.log

      - name: 校验并整理产物
        run: |
          mkdir -p build/logs
          set -o pipefail
          {
            set -euo pipefail

            APP_PATH="build/bin/easyshare.app"
            APP_EXEC="$APP_PATH/Contents/MacOS/easyshare"
            CORE_EXEC="$APP_PATH/Contents/MacOS/easyshare-core"
            DMG_PATH="build/bin/EasyShare.dmg"
            APP_ZIP="build/bin/EasyShare.app.zip"

            # 产物现状先落日志：断言失败时，光看「step failed」无从判断是哪一条。
            # 每条检查都把自己看到的实际值打出来，下次不必再猜。
            echo "::group::产物清单"
            ls -lh build/bin || true
            echo "--- .app 结构 ---"
            ls -lh "$APP_PATH/Contents/MacOS/" || true
            echo "--- lipo -archs ---"
            lipo -archs "$APP_EXEC" 2>&1 || true
            lipo -archs "$CORE_EXEC" 2>&1 || true
            echo "::endgroup::"

            test -d "$APP_PATH"
            test -x "$APP_EXEC"
            test -x "$CORE_EXEC"
            test -s "$DMG_PATH"

            verify_arches() {
              local binary="$1"
              shift
              local actual
              actual="$(lipo -archs "$binary")"
              echo "$binary architectures: $actual"

              for expected in "$@"; do
                echo "$actual" | tr ' ' '\n' | grep -Fxq "$expected" || {
                  echo "missing architecture $expected in $binary"
                  return 1
                }
              done
            }

            case "$WAILS_PLATFORM" in
              darwin/universal)
                verify_arches "$APP_EXEC" arm64 x86_64
                verify_arches "$CORE_EXEC" arm64 x86_64
                ;;
              darwin/arm64)
                verify_arches "$APP_EXEC" arm64
                verify_arches "$CORE_EXEC" arm64
                ;;
              darwin/amd64)
                verify_arches "$APP_EXEC" x86_64
                verify_arches "$CORE_EXEC" x86_64
                ;;
              *)
                echo "unsupported WAILS_PLATFORM=$WAILS_PLATFORM"
                exit 1
                ;;
            esac

            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$APP_ZIP"

            # 断言控制面地址真的进了二进制：ldflags 漏传时构建无异常，
            # 只是包指向 localhost，发布出去同事才发现登不进去。
            #
            # 为什么逐架构切片查而不用整文件 grep：universal 产物是 lipo 合并的 fat binary。
            # 若注入只对其中一个架构生效，整文件 grep 仍可能命中（扫到了有地址的那片），
            # 于是「一半用户连不上」这种最坏情况会被判为通过。切片查把每个架构都验一遍，
            # 漏注入与半注入都会硬失败。
            #
            # 为什么用 python3 字节级判定而不是 strings：macOS strings 对 Mach-O 有段语义
            # （默认只扫 __DATA，-a 的覆盖范围与 GNU strings 也不是一回事），v0.3.2/v0.4.0
            # 两轮的「未找到」都栽在它上面——连 CGO_ENABLED=0 的 Core（本地同款 go build
            # 命令，binutils strings 稳定命中 3 次）都判缺失。Windows 侧走 ReadAllBytes +
            # Contains，没有段的概念，从未误报。这里改用与 Windows 同款的字节级 in 判定，
            # 扫不到就是真不在；strings 抽样降级为对照输出。
            #
            # 【实测教训】旧实现查到第一个缺失就 return，于是「只有 x86_64 缺」还是
            # 「两个架构都缺」、App 缺还是 Core 也缺永远看不出来——而这几种原因的修法
            # 完全不同。故改为全部查完再统一判定。诊断行走 ::error:: 前缀：普通 echo
            # 只进日志文件，会被第 12 步的 tail -n 挤掉，而匿名只能拿到 annotations。
            # 空累积用字符串而非 bash 数组：runner 的 bash 3.2 在 set -u 下对空数组
            # 取 ${#arr[@]} 会直接报 unbound variable。
            MISSING=""
            bytes_hit() {
              # 字节级包含判定：与 Windows 侧 ReadAllBytes + Contains 同语义。
              # python 代码必须保持单行——run: | 块标量内顶格的多行会被 YAML 当作
              # 新键解析，直接语法错误（v0.4.0 第三轮就这么挂过一次）。
              python3 -c 'import sys; d=open(sys.argv[1],"rb").read(); sys.exit(0 if sys.argv[2].encode() in d else 1)' "$1" "$2"
            }
            bytes_count() {
              python3 -c 'import sys; d=open(sys.argv[1],"rb").read(); print(d.count(sys.argv[2].encode()))' "$1" "$2"
            }
            bytes_urls() {
              python3 -c 'import re,sys; d=open(sys.argv[1],"rb").read(); print(" ".join(sorted(set(u.decode() for u in re.findall(rb"https?://[0-9a-zA-Z.:_/-]+", d)))[:8]))' "$1"
            }
            check_baked_url() {
              local binary="$1"
              local archs
              archs="$(lipo -archs "$binary" 2>/dev/null || true)"
              if [ -z "$archs" ]; then
                # 非 fat 二进制（单架构构建）直接扫；lipo 不可用时也走这里。
                if bytes_hit "$binary" "${PLATFORM_URL}"; then
                  echo "OK: $binary 已烘焙 ${PLATFORM_URL}（命中 $(bytes_count "$binary" "${PLATFORM_URL}") 次）"
                else
                  echo "::error::$binary 中未找到 ${PLATFORM_URL}——ldflags 注入失败，产物不可发布"
                  echo "::error::  大小 $(wc -c < "$binary" | tr -d ' ') 字节；localhost:8090 命中 $(bytes_count "$binary" "http://localhost:8090") 次"
                  echo "::error::  二进制内全部 URL 抽样: $(bytes_urls "$binary")"
                  MISSING="$MISSING $binary"
                fi
                return 0
              fi
              local arch
              for arch in $archs; do
                # 切片落盘目录兜底：RUNNER_TEMP 在 Actions 里一定有，
                # 但整个块跑在 set -u 下，一次未定义变量就会让本步以
                # 「unbound variable」失败——看起来像别的检查挂了，实则根本没走到断言。
                local tmpdir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
                local slice="$tmpdir/slice-$arch.bin"
                if ! lipo "$binary" -thin "$arch" -output "$slice" 2>&1; then
                  echo "::error::无法从 $binary 抽出 $arch 切片"
                  MISSING="$MISSING $binary($arch)"
                  continue
                fi
                if bytes_hit "$slice" "${PLATFORM_URL}"; then
                  echo "OK: $binary ($arch) 已烘焙 ${PLATFORM_URL}（命中 $(bytes_count "$slice" "${PLATFORM_URL}") 次）"
                else
                  echo "::error::$binary ($arch) 中未找到 ${PLATFORM_URL}——ldflags 注入失败，产物不可发布"
                  echo "::error::  切片大小 $(wc -c < "$slice" | tr -d ' ') 字节；localhost:8090 命中 $(bytes_count "$slice" "http://localhost:8090") 次"
                  echo "::error::  切片内全部 URL 抽样: $(bytes_urls "$slice")"
                  echo "::error::  strings -a 对照命中 $(strings -a "$slice" | grep -cF "${PLATFORM_URL}" || true) 次"
                  MISSING="$MISSING $binary($arch)"
                fi
              done
              return 0
            }
            check_baked_url "$APP_EXEC"
            check_baked_url "$CORE_EXEC"
            if [ -n "$MISSING" ]; then
              echo "::error::以下产物缺失控制面地址：$MISSING"
              exit 1
            fi

            cd build/bin
            shasum -a 256 EasyShare.dmg EasyShare.app.zip > SHA256SUMS.txt
          } 2>&1 | tee build/logs/artifact-validation.log

      - name: 输出构建失败摘要
        if: failure() && hashFiles('build/logs/*.log') != ''
        run: |
          echo "### macOS 构建失败日志" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          # 先 validation 后 build log：前者短且带断言诊断，混在一起 tail 会被
          # Wails 的长日志挤出 200 行窗口，匿名看 annotations 时等于没有
          cat build/logs/artifact-validation.log build/logs/macos-build.log 2>/dev/null | tail -n 200 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          log_tail="$(cat build/logs/*.log | tail -n 100)"
          log_tail="${log_tail//'%'/'%25'}"
          log_tail="${log_tail//$'\r'/'%0D'}"
          log_tail="${log_tail//$'\n'/'%0A'}"
          echo "::error title=macOS 构建失败::$log_tail"

      - name: 上传构建诊断日志
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: EasyShare-macOS-diagnostics-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: build/logs
      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: EasyShare-macOS-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/bin/EasyShare.dmg
            build/bin/EasyShare.app.zip
            build/bin/SHA256SUMS.txt

      # 滚动 Release 由 rolling-release.yml 在双平台构建成功后统一删除重建，
      # 本工作流只上传产物，不再直接发布（避免双流水线并发互删资产）。

      - name: Publish prerelease Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          files: |
            build/bin/EasyShare.dmg
            build/bin/EasyShare.app.zip
            build/bin/SHA256SUMS.txt

      - name: Publish stable Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            build/bin/EasyShare.dmg
            build/bin/EasyShare.app.zip
            build/bin/SHA256SUMS.txt
