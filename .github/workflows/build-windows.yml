name: Windows Build

# 只在推送 v* tag 时自动打包；日常验证走本地 scripts/build.ps1，
# workflow_dispatch 保留为 Actions 页面的手动逃生通道。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      # 客户端烘焙的控制面地址。走 -ldflags -X 覆盖 internal/config.defaultPlatformBaseURL，
      # 同事装完开箱即指向公司服务器（开箱即用原则，见 ADR-0007）。
      # 为什么必须有：漏传时该变量退回源码默认值 http://localhost:8090，客户端连自己电脑，
      # 表现为「装上了但登不进去」，且构建过程毫无异常——v0.3.0 就是这么废掉的。
      # 改地址改这里（仓库变量），不改代码；两个工作流共用同一个值。
      PLATFORM_URL: ${{ vars.PLATFORM_URL || 'http://47.96.128.231:11054' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 校验发布版本与 tag
        run: node scripts/check-release-version.mjs

      - name: 发布链路回归
        run: |
          node scripts/diag/check-release-pipeline.mjs
          node --test scripts/diag/release-version.test.mjs scripts/diag/publish-release.test.mjs

      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          $makensis = Join-Path $nsisDir 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            throw "NSIS makensis not found: $makensis"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: 前端构建与测试
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend test

      - name: Go 编译与测试
        run: |
          go build ./...
          go test ./...

      - name: 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> $env:GITHUB_PATH

      - name: 校验并生成 ldflags
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLATFORM_URL)) {
            throw "PLATFORM_URL 为空：客户端会退回 http://localhost:8090，连不上服务器"
          }
          "EASYSHARE_LDFLAGS=-X easyshare/internal/config.defaultPlatformBaseURL=$($env:PLATFORM_URL)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "烘焙控制面地址：$($env:PLATFORM_URL)"

      - name: 构建 Core
        run: |
          New-Item -ItemType Directory -Force -Path build/bin | Out-Null
          go build -ldflags "$env:EASYSHARE_LDFLAGS" -o build/bin/easyshare-core.exe ./cmd/core

      - name: 构建桌面端与安装包
        run: wails build --nsis -ldflags "$env:EASYSHARE_LDFLAGS"

      - name: 校验产物
        run: |
          $files = @(
            'build/bin/easyshare.exe',
            'build/bin/easyshare-core.exe'
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing: $f" }
            Write-Host "OK: $f ($('{0:N2} MB' -f ((Get-Item $f).Length / 1MB)))"
          }
          $installer = Get-ChildItem build/bin -Filter '*-installer.exe' | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer not found in build/bin"
          }
          Write-Host "OK: $($installer.Name) ($('{0:N2} MB' -f ($installer.Length / 1MB)))"

      - name: 断言控制面地址已烘焙进二进制
        shell: pwsh
        run: |
          # ldflags 漏传时构建全程无异常，只是包指向 localhost——发布出去才发现，同事全登不进。
          # 这里把「地址确实写进去了」变成构建期硬失败，而不是发布后的人工排查。
          $expected = $env:PLATFORM_URL
          $allText = ''
          foreach ($f in @('build/bin/easyshare.exe', 'build/bin/easyshare-core.exe')) {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            $allText += $text
            if (-not $text.Contains($expected)) {
              throw "$f 中未找到 '$expected'——ldflags 注入失败，构建产物不可发布"
            }
            Write-Host "OK: $f 已烘焙 $expected"
          }
          if ($allText -match 'http://localhost:8090') {
            Write-Warning "二进制中仍存在 http://localhost:8090 字符串（可能是无关代码路径），请人工确认"
          }

      - name: 核验安装包实际产品版本
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($file in @('build/bin/easyshare.exe', 'build/bin/EasyShare-amd64-installer.exe')) {
            $actual = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $file).Path).ProductVersion
            if ($actual -ne $expected) { throw "安装资产产品版本与 tag 不一致：$file" }
          }

      - name: 记录在线更新资产证据
        run: node scripts/check-release-artifact.mjs --write windows

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: EasyShare-Windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/bin/easyshare.exe
            build/bin/easyshare-core.exe
            build/bin/*-installer.exe
            build/bin/release-metadata.json

      # 版本 tag Release 沿用原通道；滚动 latest 由 rolling-release.yml 统一负责。

      - name: Publish prerelease Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          files: |
            build/bin/easyshare.exe
            build/bin/easyshare-core.exe
            build/bin/*-installer.exe

      - name: Publish stable Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            build/bin/easyshare.exe
            build/bin/easyshare-core.exe
            build/bin/*-installer.exe

  publish-update:
    name: 发布 Windows 在线更新
    needs: build-windows
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    # 双平台发布串行，避免同版本在控制面并发登记；失败可重跑，但不取消正在上传的包。
    concurrency:
      group: control-plane-update
      cancel-in-progress: false
    env:
      PLATFORM_URL: ${{ vars.PLATFORM_URL || 'http://47.96.128.231:11054' }}
    steps:
      - name: 检出本次 tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 下载本次构建的安装资产
        uses: actions/download-artifact@v6
        with:
          name: EasyShare-Windows-${{ github.run_number }}
          path: build/bin
      - name: 核验发布资产
        run: node scripts/check-release-artifact.mjs --verify windows
      - name: 发布到客户端控制面更新源
        env:
          EASYSHARE_RELEASE_USERNAME: ${{ secrets.EASYSHARE_RELEASE_USERNAME }}
          EASYSHARE_RELEASE_PASSWORD: ${{ secrets.EASYSHARE_RELEASE_PASSWORD }}
        run: |
          node scripts/publish-release.mjs --installer-path build/bin/EasyShare-amd64-installer.exe --platform windows --kind installer --version "${GITHUB_REF_NAME#v}"
      - name: 记录发布结果
        run: printf 'Windows 正式安装包已发布到控制面，并通过匿名清单与下载摘要回验。\n' >> "$GITHUB_STEP_SUMMARY"
