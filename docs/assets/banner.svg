<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="EasyShare —— 局域网秒传 · 私有云盘 · AI 知识库">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="0.55" stop-color="#eaf7fd"/>
      <stop offset="1" stop-color="#e8faf4"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="328" rx="26" fill="url(#bg)" stroke="#dbe6f5" stroke-width="1"/>

  <!-- 图标块 -->
  <rect x="410" y="44" width="140" height="140" rx="34" fill="url(#tile)" filter="url(#soft)"/>
  <!-- 下传箭头 -->
  <path d="M455 82 v44 M455 126 l-13 -14 M455 126 l13 -14" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M436 138 h38" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <!-- 上传箭头 -->
  <path d="M505 146 v-44 M505 102 l-13 14 M505 102 l13 14" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <path d="M486 90 h38" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <!-- 知识火花 -->
  <path d="M480 46 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z" fill="#fbbf24" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 词标 -->
  <text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="700" fill="#0f172a">EasyShare</text>
  <text x="480" y="292" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#47586e">局域网秒传 · 私有云盘 · AI 知识库 —— 一套开箱即用的私有化方案</text>
</svg>
