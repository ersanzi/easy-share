name: Knowledge Tests

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    paths:
      - "knowledge/**"
      - ".github/workflows/knowledge-tests.yml"
  pull_request:
    branches:
      - master
    paths:
      - "knowledge/**"
      - ".github/workflows/knowledge-tests.yml"

permissions:
  contents: read

concurrency:
  group: knowledge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            knowledge/requirements.txt
            knowledge/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r knowledge/requirements-dev.txt

      - name: 运行测试（不含 RustFS 集成）
        working-directory: knowledge
        run: python -m pytest -m "not integration"
